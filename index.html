<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>自己管理シート</title>

<meta name="theme-color" content="#eeeafd">

<link rel="manifest" href="manifest%5B1%5D.json">
<link rel="icon" href="favicon%5B1%5D.png">
<link rel="apple-touch-icon" href="icon-192%5B2%5D.png">

<style>


* {
  box-sizing: border-box;
}

body {
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans JP",
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #f7f5ff 0%,
      #eeeafd 50%,
      #f8f6ff 100%
    );

  background-attachment: fixed;

  margin: 0;
  padding: 24px 16px;

  color: #333;

  min-height: 100vh;
}


/* =========================
   メインカード
========================= */

.container {
  width: 100%;
  max-width: 520px;

  margin: 0 auto;

  background: rgba(255,255,255,0.94);

  padding: 28px;

  border-radius: 22px;

  box-shadow:
    0 8px 30px rgba(76,63,155,0.10);

  border: 1px solid rgba(255,255,255,0.9);
}


/* =========================
   見出し
========================= */

h1 {
  text-align: center;

  color: #51449b;

  margin-top: 0;
  margin-bottom: 10px;

  font-size: 27px;

  letter-spacing: 0.03em;
}

h2 {
  color: #51449b;
}


/* =========================
   日付
========================= */

.date {
  text-align: center;

  font-size: 18px;

  margin-bottom: 24px;

  font-weight: bold;

  color: #555;
}


/* =========================
   画面
========================= */

#passwordScreen,
#sheetScreen,
#staffLoginScreen,
#staffScreen,
#recordScreen,
#addUserScreen,
#inactiveUserScreen {
  display: none;
}


/* =========================
   利用者一覧
========================= */

.user-list {
  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 12px;
}

.user-button {
  padding: 16px 10px;

  font-size: 17px;

  background: white;

  border: 1px solid #ddd8f0;

  border-radius: 12px;

  cursor: pointer;

  color: #444;

  box-shadow:
    0 2px 8px rgba(70,60,130,0.05);

  transition: 0.15s;
}

.user-button:hover {
  background: #f7f5ff;

  border-color: #bdb4e8;
}

.user-button:active {
  transform: scale(0.98);

  background: #eeeafd;
}


/* =========================
   職員ボタン
========================= */

.staff-button {
  width: 100%;

  margin-top: 28px;

  padding: 14px;

  font-size: 16px;

  background: #f3f0ff;

  color: #51449b;

  border: 1px solid #d3ccef;

  border-radius: 12px;

  cursor: pointer;
}

.staff-button:hover {
  background: #ebe7fb;
}


/* =========================
   パスワード
========================= */

#passwordScreen,
#staffLoginScreen {
  text-align: center;
}

.password-input,
.staff-input {
  width: 100%;

  padding: 14px;

  font-size: 18px;

  text-align: center;

  border: 1px solid #ccc;

  border-radius: 10px;

  margin: 10px 0 14px;

  outline: none;
}

.password-input:focus,
.staff-input:focus,
input[type="text"]:focus,
input[type="number"]:focus,
textarea:focus {
  border-color: #8d80d1;

  box-shadow:
    0 0 0 3px rgba(141,128,209,0.12);
}

.login-button {
  width: 100%;

  padding: 14px;

  font-size: 18px;

  font-weight: bold;

  color: white;

  background: #5b4bb7;

  border: none;

  border-radius: 11px;

  cursor: pointer;

  box-shadow:
    0 4px 10px rgba(91,75,183,0.18);
}

.login-button:hover {
  background: #5142a8;
}

.back-button {
  margin-top: 12px;

  padding: 10px 20px;

  font-size: 15px;

  background: white;

  border: 1px solid #bbb;

  border-radius: 9px;

  cursor: pointer;
}


/* =========================
   入力
========================= */

label {
  display: block;

  margin-top: 18px;

  margin-bottom: 7px;

  font-weight: bold;

  color: #444;
}

input[type="text"],
input[type="number"] {
  width: 100%;

  padding: 12px;

  font-size: 18px;

  border: 1px solid #ccc;

  border-radius: 9px;

  outline: none;
}

.time-input {
  text-align: center;

  letter-spacing: 2px;
}

.note {
  font-size: 13px;

  color: #666;

  margin-top: 5px;
}

.choices {
  display: flex;

  gap: 10px;
}

.choice {
  flex: 1;

  position: relative;
}

.choice input {
  display: none;
}

.choice span {
  display: block;

  text-align: center;

  padding: 12px;

  border: 1px solid #d8d4e8;

  border-radius: 9px;

  background: white;

  cursor: pointer;

  font-size: 17px;

  transition: 0.15s;
}

.choice span:hover {
  background: #f8f7fd;
}

.choice input:checked + span {
  background: #5b4bb7;

  color: white;

  border-color: #5b4bb7;

  box-shadow:
    0 3px 8px rgba(91,75,183,0.18);
}

textarea {
  width: 100%;

  min-height: 90px;

  padding: 12px;

  font-size: 16px;

  border: 1px solid #ccc;

  border-radius: 9px;

  resize: vertical;

  outline: none;
}

button.save {
  width: 100%;

  margin-top: 25px;

  padding: 15px;

  font-size: 18px;

  font-weight: bold;

  color: white;

  background: #5b4bb7;

  border: none;

  border-radius: 11px;

  cursor: pointer;

  box-shadow:
    0 4px 10px rgba(91,75,183,0.18);
}

button.save:hover {
  background: #5142a8;
}


/* =========================
   職員画面
========================= */

.staff-user-list {
  display: flex;

  flex-direction: column;

  gap: 10px;

  margin-top: 20px;
}

.staff-user-card {
  border: 1px solid #e0dcec;

  border-radius: 13px;

  padding: 13px;

  background: #fbfaff;
}

.staff-user-name {
  font-size: 17px;

  font-weight: bold;

  margin-bottom: 10px;

  color: #444;
}

.staff-user-actions {
  display: flex;

  gap: 8px;
}

.record-view-button {
  flex: 1;

  padding: 10px;

  font-size: 15px;

  background: white;

  border: 1px solid #cfc9e4;

  color: #51449b;

  border-radius: 8px;

  cursor: pointer;
}

.record-view-button:active {
  background: #f1effb;
}

.staff-header {
  display: flex;

  justify-content: space-between;

  align-items: center;

  gap: 10px;

  margin-bottom: 20px;
}

.staff-header h1 {
  margin: 0;
}

.logout-button {
  padding: 8px 12px;

  background: white;

  border: 1px solid #bbb;

  border-radius: 8px;

  cursor: pointer;
}

.record-card {
  border: 1px solid #e0dcec;

  border-radius: 13px;

  padding: 15px;

  margin-bottom: 12px;

  background: #fbfaff;
}

.record-date {
  font-size: 17px;

  font-weight: bold;

  color: #51449b;

  margin-bottom: 10px;
}

.record-row {
  margin: 6px 0;

  line-height: 1.5;
}

.record-label {
  font-weight: bold;
}

.no-record,
.loading {
  text-align: center;

  color: #666;

  padding: 30px 10px;
}

.staff-back {
  width: 100%;

  margin-top: 10px;

  padding: 12px;

  background: white;

  border: 1px solid #bbb;

  border-radius: 9px;

  font-size: 16px;

  cursor: pointer;
}


/* =========================
   職員 管理ボタン
========================= */

.management-area {
  margin-top: 25px;

  border-top: 1px solid #ddd;

  padding-top: 20px;
}

.management-button {
  width: 100%;

  padding: 13px;

  margin-top: 10px;

  font-size: 16px;

  background: #f3f0ff;

  color: #51449b;

  border: 1px solid #d3ccef;

  border-radius: 10px;

  cursor: pointer;
}

.management-card {
  border: 1px solid #ddd;

  border-radius: 12px;

  padding: 15px;

  margin-top: 10px;

  background: #fafafa;
}

.management-name {
  font-size: 17px;

  font-weight: bold;

  margin-bottom: 12px;
}

.management-actions {
  display: flex;

  gap: 8px;
}

.stop-button {
  flex: 1;

  padding: 10px;

  background: white;

  border: 1px solid #d88;

  color: #a33;

  border-radius: 8px;

  cursor: pointer;
}

.resume-button {
  flex: 1;

  padding: 10px;

  background: white;

  border: 1px solid #8a8;

  color: #373;

  border-radius: 8px;

  cursor: pointer;
}


/* =========================
   利用者追加
========================= */

.form-input {
  width: 100%;

  padding: 13px;

  font-size: 17px;

  border: 1px solid #ccc;

  border-radius: 8px;

  margin-bottom: 5px;

  outline: none;
}

.form-note {
  font-size: 13px;

  color: #666;

  margin-bottom: 15px;
}

.add-button {
  width: 100%;

  padding: 14px;

  margin-top: 15px;

  font-size: 17px;

  font-weight: bold;

  color: white;

  background: #5b4bb7;

  border: none;

  border-radius: 10px;

  cursor: pointer;
}


/* =========================
   スマホ
========================= */

@media (max-width: 480px) {

  body {
    padding: 10px;
  }

  .container {
    padding: 20px 17px;

    border-radius: 18px;
  }

  h1 {
    font-size: 24px;
  }

  .record-card {
    font-size: 15px;
  }

  .staff-user-actions {
    flex-direction: column;
  }

}

</style>

</head>

<!-- =========================
     トップページ
========================= -->

<div id="loginScreen">

  <h1>自己管理シート</h1>

  <h2 style="text-align:center;">
    自分の名前を選んでください
  </h2>

  <div class="user-list" id="userList"></div>

  <div id="userLoading" class="loading">
    利用者一覧を読み込んでいます……
  </div>

  <button class="staff-button" id="staffButton">
    職員はこちら
  </button>

</div>

<!-- =========================

========================= -->

<div id="passwordScreen">

  <h1>自己管理シート</h1>

  <h2 id="selectedUser"></h2>

  <p>パスワードを入力してください</p>

<input
type="password"
id="password"
class="password-input"
inputmode="numeric"
maxlength="8"
placeholder="パスワード"

>

  <button class="login-button" id="loginButton">
    ログイン
  </button>

  <br>

  <button class="back-button" id="backButton">
    名前を選び直す
  </button>

</div>

<!-- =========================
     今日の自己管理
========================= -->

<div id="sheetScreen">

  ></div>

<label>来所時間</label>

<input
type="text"
id="arrival"
class="time-input"
inputmode="numeric"
maxlength="5"
placeholder="例：15:30"
autocomplete="off"

>

<label>帰所時間</label>

<input
type="text"
id="leave"
class="time-input"
inputmode="numeric"
maxlength="5"
placeholder="例：18:00"
autocomplete="off"

>

<label>体温</label>

<input
type="text"
id="temp"
inputmode="decimal"
placeholder="例：36.5"
autocomplete="off"

>

  <div class="note">
    体温は36.5のように「.」を入れて入力してください。
  </div>

<label>咳</label>

  <div class="choices" id="cough"></div>

<label>頭痛</label>

  <div class="choices" id="headache"></div>

<label>鼻水</label>

  <div class="choices" id="runny"></div>

<label>のど痛</label>

  <div class="choices" id="throat"></div>

<label>その他</label>

  <textarea
    id="other"
    placeholder="気になることがあれば入力してください"
  ></textarea>

  <button class="save" id="save">
    保存
  </button>

</div>

<!-- =========================
     職員ログイン
========================= -->

<div id="staffLoginScreen">

  <h1>職員用</h1>

  <p>職員用パスワードを入力してください</p>

<input
type="password"
id="staffPassword"
class="staff-input"
placeholder="パスワード"
autocomplete="current-password"

>

  <button class="login-button" id="staffLoginButton">
    職員ログイン
  </button>

  <button class="back-button" id="staffLoginBackButton">
    戻る
  </button>

</div>

<!-- =========================
     職員 利用者選択
========================= -->

<div id="staffScreen">

  <div class="staff-header">

<h1>記録確認</h1>

<button class="logout-button" id="staffLogoutButton">
  ログアウト
</button>

  </div>

  <p style="text-align:center;">
    確認する利用者を選んでください
  </p>

  <div
    class="staff-user-list"
    id="staffUserList"
  ></div>

  <div class="management-area">

<button
  class="management-button"
  id="addUserButton"
>
  ＋ 利用者を追加
</button>

<button
  class="management-button"
  id="inactiveUserButton"
>
  利用停止者を確認
</button>

  </div>

</div>
