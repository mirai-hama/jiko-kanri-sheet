<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自己管理シート</title>

<style>
body {
  font-family: sans-serif;
  background: #f5f6fa;
  margin: 0;
  padding: 20px;
  color: #333;
}

.container {
  max-width: 500px;
  margin: auto;
  background: white;
  padding: 24px;
  border-radius: 16px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

h1 {
  text-align: center;
  color: #4b3f9b;
  margin-bottom: 8px;
}

h2 {
  color: #4b3f9b;
}

.date {
  text-align: center;
  font-size: 18px;
  margin-bottom: 24px;
  font-weight: bold;
}

/* 共通画面 */
#passwordScreen,
#sheetScreen,
#staffLoginScreen,
#staffScreen,
#recordScreen {
  display: none;
}

/* 利用者一覧 */
.user-list {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.user-button {
  padding: 15px 10px;
  font-size: 17px;
  background: #fff;
  border: 2px solid #ddd;
  border-radius: 10px;
  cursor: pointer;
}

.user-button:active {
  background: #eee;
}

/* 職員ボタン */
.staff-button {
  width: 100%;
  margin-top: 25px;
  padding: 13px;
  font-size: 16px;
  background: #f1effb;
  color: #4b3f9b;
  border: 1px solid #c9c2ec;
  border-radius: 10px;
  cursor: pointer;
}

/* パスワード */
#passwordScreen,
#staffLoginScreen {
  text-align: center;
}

.password-input,
.staff-input {
  width: 100%;
  box-sizing: border-box;
  padding: 13px;
  font-size: 18px;
  text-align: center;
  border: 1px solid #ccc;
  border-radius: 8px;
  margin: 10px 0;
}

.login-button {
  width: 100%;
  padding: 14px;
  font-size: 18px;
  font-weight: bold;
  color: white;
  background: #4b3f9b;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}

.back-button {
  margin-top: 12px;
  padding: 10px 20px;
  font-size: 15px;
  background: white;
  border: 1px solid #bbb;
  border-radius: 8px;
}

/* 入力 */
label {
  display: block;
  margin-top: 18px;
  margin-bottom: 7px;
  font-weight: bold;
}

input[type="text"],
input[type="number"] {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  font-size: 18px;
  border: 1px solid #ccc;
  border-radius: 8px;
}

.time-input {
  text-align: center;
  letter-spacing: 2px;
}

.note {
  font-size: 13px;
  color: #666;
  margin-top: 5px;
}

.choices {
  display: flex;
  gap: 10px;
}

.choice {
  flex: 1;
  position: relative;
}

.choice input {
  display: none;
}

.choice span {
  display: block;
  text-align: center;
  padding: 12px;
  border: 2px solid #ddd;
  border-radius: 8px;
  background: #fff;
  cursor: pointer;
  font-size: 17px;
}

.choice input:checked + span {
  background: #5b4bb7;
  color: white;
  border-color: #5b4bb7;
}

textarea {
  width: 100%;
  box-sizing: border-box;
  min-height: 90px;
  padding: 12px;
  font-size: 16px;
  border: 1px solid #ccc;
  border-radius: 8px;
  resize: vertical;
}

button.save {
  width: 100%;
  margin-top: 25px;
  padding: 14px;
  font-size: 18px;
  font-weight: bold;
  color: white;
  background: #4b3f9b;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}

/* 職員画面 */
.staff-user-list {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 20px;
}

.staff-user-button {
  padding: 14px 8px;
  font-size: 16px;
  background: white;
  border: 2px solid #ddd;
  border-radius: 10px;
  cursor: pointer;
}

.staff-user-button:active {
  background: #eee;
}

.staff-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 20px;
}

.staff-header h1 {
  margin: 0;
}

.logout-button {
  padding: 8px 12px;
  background: white;
  border: 1px solid #bbb;
  border-radius: 8px;
  cursor: pointer;
}

.record-card {
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 12px;
  background: #fafafa;
}

.record-date {
  font-size: 17px;
  font-weight: bold;
  color: #4b3f9b;
  margin-bottom: 10px;
}

.record-row {
  margin: 6px 0;
  line-height: 1.5;
}

.record-label {
  font-weight: bold;
}

.no-record,
.loading {
  text-align: center;
  color: #666;
  padding: 30px 10px;
}

.staff-back {
  width: 100%;
  margin-top: 10px;
  padding: 12px;
  background: white;
  border: 1px solid #bbb;
  border-radius: 8px;
  font-size: 16px;
}

@media (max-width: 480px) {
  body {
    padding: 10px;
  }

  .container {
    padding: 18px;
  }

  .record-card {
    font-size: 15px;
  }
}
</style>
</head>

<body>

<div class="container">

<!-- =========================
     トップページ
========================= -->

<div id="loginScreen">

  <h1>自己管理シート</h1>

  <h2 style="text-align:center;">
    自分の名前を選んでください
  </h2>

  <div class="user-list" id="userList"></div>

  <button class="staff-button" id="staffButton">
    職員はこちら
  </button>

</div>


<!-- =========================
     利用者パスワード
========================= -->

<div id="passwordScreen">

  <h1>自己管理シート</h1>

  <h2 id="selectedUser"></h2>

  <p>パスワードを入力してください</p>

  <input
    type="password"
    id="password"
    class="password-input"
    inputmode="numeric"
    maxlength="8"
    placeholder="パスワード"
  >

  <button class="login-button" id="loginButton">
    ログイン
  </button>

  <br>

  <button class="back-button" id="backButton">
    名前を選び直す
  </button>

</div>


<!-- =========================
     今日の自己管理
========================= -->

<div id="sheetScreen">

  <h1>自己管理シート</h1>

  <div class="date" id="date"></div>

  <div
    style="text-align:center; font-weight:bold;"
    id="userName"
  ></div>

  <label>来所時間</label>

  <input
    type="text"
    id="arrival"
    class="time-input"
    inputmode="numeric"
    maxlength="5"
    placeholder="例：15:30"
    autocomplete="off"
  >

  <label>帰所時間</label>

  <input
    type="text"
    id="leave"
    class="time-input"
    inputmode="numeric"
    maxlength="5"
    placeholder="例：18:00"
    autocomplete="off"
  >

  <label>体温</label>

  <input
    type="text"
    id="temp"
    inputmode="decimal"
    placeholder="例：36.5"
    autocomplete="off"
  >

  <div class="note">
    体温は36.5のように「.」を入れて入力してください。
  </div>

  <label>咳</label>
  <div class="choices" id="cough"></div>

  <label>頭痛</label>
  <div class="choices" id="headache"></div>

  <label>鼻水</label>
  <div class="choices" id="runny"></div>

  <label>のど痛</label>
  <div class="choices" id="throat"></div>

  <label>その他</label>

  <textarea
    id="other"
    placeholder="気になることがあれば入力してください"
  ></textarea>

  <button class="save" id="save">
    保存
  </button>

</div>


<!-- =========================
     職員ログイン
========================= -->

<div id="staffLoginScreen">

  <h1>職員用</h1>

  <p>職員用パスワードを入力してください</p>

  <input
    type="password"
    id="staffPassword"
    class="staff-input"
    placeholder="パスワード"
    autocomplete="current-password"
  >

  <button class="login-button" id="staffLoginButton">
    職員ログイン
  </button>

  <button class="back-button" id="staffLoginBackButton">
    戻る
  </button>

</div>


<!-- =========================
     職員 利用者選択
========================= -->

<div id="staffScreen">

  <div class="staff-header">

    <h1>記録確認</h1>

    <button class="logout-button" id="staffLogoutButton">
      ログアウト
    </button>

  </div>

  <p style="text-align:center;">
    確認する利用者を選んでください
  </p>

  <div
    class="staff-user-list"
    id="staffUserList"
  ></div>

</div>


<!-- =========================
     職員 記録一覧
========================= -->

<div id="recordScreen">

  <div class="staff-header">

    <h1>記録一覧</h1>

    <button class="logout-button" id="recordLogoutButton">
      ログアウト
    </button>

  </div>

  <div
    style="
      text-align:center;
      font-size:18px;
      font-weight:bold;
      color:#4b3f9b;
      margin-bottom:20px;
    "
    id="recordUserName"
  ></div>

  <div id="records"></div>

  <button class="staff-back" id="recordBackButton">
    利用者選択に戻る
  </button>

</div>

</div>


<!-- =========================
     Supabase
========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================
   Supabase設定
========================= */

const SUPABASE_URL =
  "https://yiohaakomljvrulaajoy.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_dcqfIAZQTHkG3NbAgvkftw_emYjMZ_F";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/*
  職員用Supabaseアカウントのメールアドレス。

  職員は画面でメールアドレスを入力しません。

  あとでSupabaseのAuthenticationに作る
  職員アカウントのメールアドレスと
  ここを同じにします。
*/

const STAFF_EMAIL = "staff@example.com";


/* =========================
   利用者設定
========================= */

const users = [
  { name: "Aさん", password: "1234" },
  { name: "Bさん", password: "1234" },
  { name: "Cさん", password: "1234" },
  { name: "Dさん", password: "1234" },
  { name: "Eさん", password: "1234" },
  { name: "Fさん", password: "1234" },
  { name: "Gさん", password: "1234" },
  { name: "Hさん", password: "1234" },
  { name: "Iさん", password: "1234" },
  { name: "Jさん", password: "1234" },
  { name: "Kさん", password: "1234" },
  { name: "Lさん", password: "1234" },
  { name: "Mさん", password: "1234" },
  { name: "Nさん", password: "1234" }
];

let selectedUser = null;


/* =========================
   画面切り替え
========================= */

function hideAllScreens() {

  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("passwordScreen").style.display = "none";
  document.getElementById("sheetScreen").style.display = "none";
  document.getElementById("staffLoginScreen").style.display = "none";
  document.getElementById("staffScreen").style.display = "none";
  document.getElementById("recordScreen").style.display = "none";

}


/* =========================
   利用者一覧
========================= */

const userList =
  document.getElementById("userList");

users.forEach((user) => {

  const button =
    document.createElement("button");

  button.className = "user-button";
  button.textContent = user.name;

  button.addEventListener("click", () => {

    selectedUser = user;

    hideAllScreens();

    document.getElementById("passwordScreen").style.display =
      "block";

    document.getElementById("selectedUser").textContent =
      user.name;

    document.getElementById("password").value = "";

    document.getElementById("password").focus();

  });

  userList.appendChild(button);

});


/* =========================
   利用者パスワード
========================= */

document
  .getElementById("loginButton")
  .addEventListener("click", () => {

    const password =
      document.getElementById("password").value;

    if (password === selectedUser.password) {

      hideAllScreens();

      document.getElementById("sheetScreen").style.display =
        "block";

      document.getElementById("userName").textContent =
        selectedUser.name;

    } else {

      alert("パスワードが違います。");

      document.getElementById("password").value = "";

      document.getElementById("password").focus();

    }

  });


/* Enterキーでもログイン */

document
  .getElementById("password")
  .addEventListener("keydown", (e) => {

    if (e.key === "Enter") {

      document
        .getElementById("loginButton")
        .click();

    }

  });


/* =========================
   名前を選び直す
========================= */

document
  .getElementById("backButton")
  .addEventListener("click", () => {

    selectedUser = null;

    hideAllScreens();

    document.getElementById("loginScreen").style.display =
      "block";

  });


/* =========================
   今日の日付
========================= */

const today = new Date();

const year = today.getFullYear();
const month = today.getMonth() + 1;
const day = today.getDate();

const weekdays =
  ["日","月","火","水","木","金","土"];

document.getElementById("date").textContent =
  `${year}年${month}月${day}日（${weekdays[today.getDay()]}）`;


/* =========================
   体調項目
========================= */

const healthItems = [
  ["cough", "咳"],
  ["headache", "頭痛"],
  ["runny", "鼻水"],
  ["throat", "のど痛"]
];

healthItems.forEach(([id, name]) => {

  const box =
    document.getElementById(id);

  box.innerHTML = `

    <label class="choice">

      <input
        type="radio"
        name="${id}"
        value="有"
      >

      <span>有</span>

    </label>

    <label class="choice">

      <input
        type="radio"
        name="${id}"
        value="無"
      >

      <span>無</span>

    </label>

  `;

});


/* =========================
   有・無の選択・解除
========================= */

document
  .querySelectorAll(".choices input")
  .forEach(input => {

    input.addEventListener("click", function(e) {

      if (this.dataset.checked === "true") {

        this.checked = false;

        this.dataset.checked = "false";

        e.preventDefault();

      } else {

        const name = this.name;

        document
          .querySelectorAll(
            `input[name="${name}"]`
          )
          .forEach(other => {

            other.dataset.checked = "false";

          });

        this.dataset.checked = "true";

      }

    });

  });


/* =========================
   時間入力
========================= */

function setupTimeInput(id) {

  const input =
    document.getElementById(id);

  input.addEventListener("input", function() {

    let value = this.value;

    value =
      value.replace(/[^0-9]/g, "");

    value =
      value.slice(0, 4);

    if (value.length > 2) {

      value =
        value.slice(0, 2) +
        ":" +
        value.slice(2);

    }

    this.value = value;

    if (value.length === 3) {

      this.setSelectionRange(3, 3);

    }

  });


  input.addEventListener("blur", function() {

    let value =
      this.value.replace(/[^0-9]/g, "");

    if (value.length === 3) {

      value =
        "0" + value;

    }

    if (value.length === 4) {

      this.value =
        value.slice(0, 2) +
        ":" +
        value.slice(2);

    }

  });

}

setupTimeInput("arrival");
setupTimeInput("leave");


/* =========================
   保存
========================= */

document
  .getElementById("save")
  .addEventListener("click", async function() {

    const arrival =
      document.getElementById("arrival").value;

    const leave =
      document.getElementById("leave").value;

    const temp =
      document.getElementById("temp").value;


    if (!arrival || !leave || !temp) {

      alert(
        "来所時間・帰所時間・体温を入力してください。"
      );

      return;

    }


    const timePattern =
      /^(?:[01]\d|2[0-3]):[0-5]\d$/;


    if (
      !timePattern.test(arrival) ||
      !timePattern.test(leave)
    ) {

      alert(
        "時間は「15:30」のように入力してください。"
      );

      return;

    }


    if (!/^\d{2}\.\d$/.test(temp)) {

      alert(
        "体温は「36.5」のように「.」を入れて入力してください。"
      );

      return;

    }


    const healthNames = [
      "cough",
      "headache",
      "runny",
      "throat"
    ];


    const healthValues = {};


    for (const name of healthNames) {

      const selected =
        document.querySelector(
          `input[name="${name}"]:checked`
        );

      if (!selected) {

        alert(
          "体調変化の「有・無」をすべて選択してください。"
        );

        return;

      }

      healthValues[name] =
        selected.value;

    }


    const recordDate =
      `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;


    const other =
      document.getElementById("other").value;


    const { error } =
      await supabaseClient
        .from("health_records")
        .insert([
          {
            user_name:
              selectedUser.name,

            record_date:
              recordDate,

            arrival:
              arrival,

            leave:
              leave,

            temperature:
              Number(temp),

            cough:
              healthValues.cough,

            headache:
              healthValues.headache,

            runny:
              healthValues.runny,

            throat:
              healthValues.throat,

            other:
              other
          }
        ]);


    if (error) {

      console.error(error);

      alert(
        "保存できませんでした。\n" +
        error.message
      );

      return;

    }


    alert("記録を保存しました。");

  });


/* =====================================================
   職員用
===================================================== */


/* =========================
   職員ログイン画面へ
========================= */

document
  .getElementById("staffButton")
  .addEventListener("click", () => {

    hideAllScreens();

    document
      .getElementById("staffLoginScreen")
      .style.display = "block";

    document
      .getElementById("staffPassword")
      .value = "";

    document
      .getElementById("staffPassword")
      .focus();

  });


/* =========================
   職員ログイン
========================= */

document
  .getElementById("staffLoginButton")
  .addEventListener("click", async () => {

    const password =
      document.getElementById("staffPassword").value;


    if (!password) {

      alert(
        "職員用パスワードを入力してください。"
      );

      return;

    }


    const { error } =
      await supabaseClient.auth.signInWithPassword({

        email: STAFF_EMAIL,

        password: password

      });


    if (error) {

      console.error(error);

      alert(
        "ログインできませんでした。\n" +
        error.message
      );

      return;

    }


    document.getElementById("staffPassword").value = "";

    showStaffScreen();

  });


/* =========================
   職員画面表示
========================= */

function showStaffScreen() {

  hideAllScreens();

  document
    .getElementById("staffScreen")
    .style.display = "block";

}


/* =========================
   職員ログイン画面から戻る
========================= */

document
  .getElementById("staffLoginBackButton")
  .addEventListener("click", async () => {

    await supabaseClient.auth.signOut();

    hideAllScreens();

    document
      .getElementById("loginScreen")
      .style.display = "block";

  });


/* =========================
   職員用 利用者一覧
========================= */

const staffUserList =
  document.getElementById("staffUserList");


users.forEach((user) => {

  const button =
    document.createElement("button");

  button.className =
    "staff-user-button";

  button.textContent =
    user.name;

  button.addEventListener("click", () => {

    loadRecords(user.name);

  });

  staffUserList.appendChild(button);

});


/* =========================
   記録取得
========================= */

async function loadRecords(userName) {

  hideAllScreens();

  document
    .getElementById("recordScreen")
    .style.display = "block";


  document
    .getElementById("recordUserName")
    .textContent =
      `${userName}の記録`;


  const records =
    document.getElementById("records");


  records.innerHTML =
    `<div class="loading">
      記録を読み込んでいます……
    </div>`;


  const { data, error } =
    await supabaseClient
      .from("health_records")
      .select("*")
      .eq("user_name", userName)
      .order("record_date", {
        ascending: false
      });


  if (error) {

    console.error(error);

    records.innerHTML =
      `<div class="no-record">
        記録を読み込めませんでした。<br><br>
        ${error.message}
      </div>`;

    return;

  }


  if (!data || data.length === 0) {

    records.innerHTML =
      `<div class="no-record">
        この利用者の記録はありません。
      </div>`;

    return;

  }


  records.innerHTML = "";


  data.forEach(record => {

    const card =
      document.createElement("div");

    card.className =
      "record-card";


    const dateParts =
      record.record_date
        ? record.record_date.split("-")
        : [];


    let displayDate =
      record.record_date || "";


    if (dateParts.length === 3) {

      displayDate =
        `${Number(dateParts[0])}年${Number(dateParts[1])}月${Number(dateParts[2])}日`;

    }


    card.innerHTML = `

      <div class="record-date">
        ${displayDate}
      </div>

      <div class="record-row">
        <span class="record-label">来所：</span>
        ${record.arrival || ""}
      </div>

      <div class="record-row">
        <span class="record-label">帰所：</span>
        ${record.leave || ""}
      </div>

      <div class="record-row">
        <span class="record-label">体温：</span>
        ${record.temperature ?? ""}
      </div>

      <div class="record-row">
        <span class="record-label">咳：</span>
        ${record.cough || ""}
      </div>

      <div class="record-row">
        <span class="record-label">頭痛：</span>
        ${record.headache || ""}
      </div>

      <div class="record-row">
        <span class="record-label">鼻水：</span>
        ${record.runny || ""}
      </div>

      <div class="record-row">
        <span class="record-label">のど痛：</span>
        ${record.throat || ""}
      </div>

      <div class="record-row">
        <span class="record-label">その他：</span>
        ${record.other || "なし"}
      </div>

    `;


    records.appendChild(card);

  });

}


/* =========================
   記録画面 → 利用者選択
========================= */

document
  .getElementById("recordBackButton")
  .addEventListener("click", () => {

    showStaffScreen();

  });


/* =========================
   職員ログアウト
========================= */

async function staffLogout() {

  await supabaseClient.auth.signOut();

  hideAllScreens();

  document
    .getElementById("loginScreen")
    .style.display = "block";

}


document
  .getElementById("staffLogoutButton")
  .addEventListener(
    "click",
    staffLogout
  );


document
  .getElementById("recordLogoutButton")
  .addEventListener(
    "click",
    staffLogout
  );


/* =========================
   職員ログイン Enterキー
========================= */

document
  .getElementById("staffPassword")
  .addEventListener("keydown", (e) => {

    if (e.key === "Enter") {

      document
        .getElementById("staffLoginButton")
        .click();

    }

  });

</script>
