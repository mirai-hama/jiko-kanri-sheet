<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自己管理シート</title>
<style>
body {
  font-family: sans-serif;
  background: #f5f6fa;
  margin: 0;
  padding: 20px;
  color: #333;
}
.container {
  max-width: 500px;
  margin: auto;
  background: white;
  padding: 24px;
  border-radius: 16px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}
h1 {
  text-align: center;
  color: #4b3f9b;
  margin-bottom: 8px;
}
.date {
  text-align: center;
  font-size: 18px;
  margin-bottom: 24px;
  font-weight: bold;
}
label {
  display: block;
  margin-top: 18px;
  margin-bottom: 7px;
  font-weight: bold;
}
input[type="text"],
input[type="number"] {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  font-size: 18px;
  border: 1px solid #ccc;
  border-radius: 8px;
}
.time-input {
  text-align: center;
  letter-spacing: 2px;
}
.note {
  font-size: 13px;
  color: #666;
  margin-top: 5px;
}
.choices {
  display: flex;
  gap: 10px;
}
.choice {
  flex: 1;
  position: relative;
}
.choice input {
  display: none;
}
.choice span {
  display: block;
  text-align: center;
  padding: 12px;
  border: 2px solid #ddd;
  border-radius: 8px;
  background: #fff;
  cursor: pointer;
  font-size: 17px;
}
.choice input:checked + span {
  background: #5b4bb7;
  color: white;
  border-color: #5b4bb7;
}
textarea {
  width: 100%;
  box-sizing: border-box;
  min-height: 90px;
  padding: 12px;
  font-size: 16px;
  border: 1px solid #ccc;
  border-radius: 8px;
  resize: vertical;
}
button.save {
  width: 100%;
  margin-top: 25px;
  padding: 14px;
  font-size: 18px;
  font-weight: bold;
  color: white;
  background: #4b3f9b;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}
button.save:active {
  opacity: 0.8;
}
</style>
</head>

<body>

<div class="container">

<h1>自己管理シート</h1>

<div class="date" id="date"></div>

<label>来所時間</label>
<input
  type="text"
  id="arrival"
  class="time-input"
  inputmode="numeric"
  maxlength="5"
  placeholder="例：15:30"
  autocomplete="off"
>

<label>帰る時間</label>
<input
  type="text"
  id="leave"
  class="time-input"
  inputmode="numeric"
  maxlength="5"
  placeholder="例：18:00"
  autocomplete="off"
>

<label>体温</label>
<input
  type="text"
  id="temp"
  inputmode="decimal"
  placeholder="例：36.5"
  autocomplete="off"
>
<div class="note">
体温は36.5のように「.」を入れて入力してください。
</div>

<label>咳</label>
<div class="choices" id="cough"></div>

<label>頭痛</label>
<div class="choices" id="headache"></div>

<label>鼻水</label>
<div class="choices" id="runny"></div>

<label>のど痛</label>
<div class="choices" id="throat"></div>

<label>その他</label>
<textarea id="other" placeholder="気になることがあれば入力してください"></textarea>

<button class="save" id="save">保存</button>

</div>

<script>

// 今日の日付
const today = new Date();

const year = today.getFullYear();
const month = today.getMonth() + 1;
const day = today.getDate();

const weekdays = ["日","月","火","水","木","金","土"];

document.getElementById("date").textContent =
  `${year}年${month}月${day}日（${weekdays[today.getDay()]}）`;


// 体調項目を作成
const healthItems = [
  ["cough", "咳"],
  ["headache", "頭痛"],
  ["runny", "鼻水"],
  ["throat", "のど痛"]
];

healthItems.forEach(([id, name]) => {

  const box = document.getElementById(id);

  box.innerHTML = `
    <label class="choice">
      <input type="radio" name="${id}" value="有">
      <span>有</span>
    </label>

    <label class="choice">
      <input type="radio" name="${id}" value="無">
      <span>無</span>
    </label>
  `;

});


// 有・無を押すと選択。
// 選択中のものをもう一度押すと解除
document.querySelectorAll(".choices input").forEach(input => {

  input.addEventListener("click", function(e) {

    if (this.dataset.checked === "true") {
      this.checked = false;
      this.dataset.checked = "false";
      e.preventDefault();
    } else {

      const name = this.name;

      document
        .querySelectorAll(`input[name="${name}"]`)
        .forEach(other => {
          other.dataset.checked = "false";
        });

      this.dataset.checked = "true";
    }

  });

});


// 時間入力
// 15 と入力すると自動的に 15:
// そのまま 30 と入力すると 15:30 になる
function setupTimeInput(id) {

  const input = document.getElementById(id);

  input.addEventListener("input", function() {

    let value = this.value;

    // 数字以外を削除
    value = value.replace(/[^0-9]/g, "");

    // 4桁まで
    value = value.slice(0, 4);

    // 2桁入力されたら : を自動追加
    if (value.length > 2) {
      value = value.slice(0, 2) + ":" + value.slice(2);
    }

    this.value = value;

    // 「15:」まで入力されたら分の位置へ
    if (value.length === 3) {
      this.setSelectionRange(3, 3);
    }

  });

  // キーボードから : を入力しても対応
  input.addEventListener("blur", function() {

    let value = this.value.replace(/[^0-9]/g, "");

    if (value.length === 3) {
      value = "0" + value;
    }

    if (value.length === 4) {
      this.value =
        value.slice(0, 2) + ":" + value.slice(2);
    }

  });

}

setupTimeInput("arrival");
setupTimeInput("leave");


// 保存
document.getElementById("save").addEventListener("click", function() {

  const arrival = document.getElementById("arrival").value;
  const leave = document.getElementById("leave").value;
  const temp = document.getElementById("temp").value;

  const healthNames = ["cough", "headache", "runny", "throat"];

  // 必須チェック
  if (!arrival || !leave || !temp) {
    alert("来所時間・帰る時間・体温を入力してください。");
    return;
  }

  // 時間チェック
  const timePattern = /^(?:[01]\d|2[0-3]):[0-5]\d$/;

  if (!timePattern.test(arrival) || !timePattern.test(leave)) {
    alert("時間は「15:30」のように入力してください。");
    return;
  }

  // 体温チェック
  if (!/^\d{2}\.\d$/.test(temp)) {
    alert("体温は「36.5」のように「.」を入れて入力してください。");
    return;
  }

  // 体調チェック
  for (const name of healthNames) {

    const selected =
      document.querySelector(`input[name="${name}"]:checked`);

    if (!selected) {
      alert("体調変化の「有・無」をすべて選択してください。");
      return;
    }

  }

  alert("記録を保存しました。");

});

</script>

</body>
</html>
