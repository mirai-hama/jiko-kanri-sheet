<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>自己管理シート</title>

>


<style>

/* =====================================================
   全体
===================================================== */

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
}

body {

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans JP",
    "Yu Gothic",
    "Hiragino Kaku Gothic ProN",
    sans-serif;

  background:
    radial-gradient(
      circle at 10% 10%,
      rgba(190, 220, 255, 0.65),
      transparent 32%
    ),
    radial-gradient(
      circle at 90% 20%,
      rgba(220, 195, 255, 0.60),
      transparent 35%
    ),
    linear-gradient(
      135deg,
      #eef8ff 0%,
      #f5f1ff 50%,
      #fdf7ff 100%
    );

  background-attachment: fixed;

  margin: 0;
  padding: 20px;

  color: #333;

  min-height: 100vh;
}


/* =====================================================
   メインカード
===================================================== */

.container {

  max-width: 500px;

  margin: 25px auto;

  background:
    rgba(255,255,255,0.94);

  padding: 24px;

  border-radius: 24px;

  box-shadow:
    0 12px 40px rgba(91,75,183,0.12),
    0 3px 12px rgba(0,0,0,0.05);

  border:
    1px solid rgba(255,255,255,0.9);

}


/* =====================================================
   見出し
===================================================== */

h1 {

  text-align: center;

  color: #51449f;

  margin-bottom: 8px;

  letter-spacing: 1px;

}

h2 {

  color: #51449f;

}

.date {

  text-align: center;

  font-size: 18px;

  margin-bottom: 24px;

  font-weight: bold;

  color: #555;

}


/* =====================================================
   画面
===================================================== */

#passwordScreen,
#sheetScreen,
#staffLoginScreen,
#staffScreen,
#recordScreen,
#addUserScreen,
#inactiveUserScreen {

  display: none;

}


/* =====================================================
   利用者一覧
===================================================== */

.user-list {

  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 12px;

}

.user-button {

  padding: 16px 10px;

  font-size: 17px;

  font-weight: bold;

  background:
    linear-gradient(
      135deg,
      #ffffff,
      #f7f5ff
    );

  color: #444;

  border:
    1px solid #ddd8f4;

  border-radius: 14px;

  cursor: pointer;

  box-shadow:
    0 3px 10px rgba(91,75,183,0.06);

  transition:
    transform .15s,
    box-shadow .15s;

}

.user-button:active {

  transform: scale(0.98);

  box-shadow:
    0 1px 5px rgba(91,75,183,0.08);

}


/* =====================================================
   職員ボタン
===================================================== */

.staff-button {

  width: 100%;

  margin-top: 25px;

  padding: 14px;

  font-size: 16px;

  background:
    linear-gradient(
      135deg,
      #f5f2ff,
      #eef8ff
    );

  color: #51449f;

  border:
    1px solid #d5cef3;

  border-radius: 12px;

  cursor: pointer;

}


/* =====================================================
   パスワード
===================================================== */

#passwordScreen,
#staffLoginScreen {

  text-align: center;

}

.password-input,
.staff-input {

  width: 100%;

  padding: 14px;

  font-size: 18px;

  text-align: center;

  border:
    1px solid #d7d4e5;

  border-radius: 12px;

  margin: 10px 0;

  background: #fcfcff;

}

.password-input:focus,
.staff-input:focus,
input:focus,
textarea:focus {

  outline: none;

  border-color: #9b8ee2;

  box-shadow:
    0 0 0 3px rgba(155,142,226,0.15);

}

.login-button {

  width: 100%;

  padding: 14px;

  font-size: 18px;

  font-weight: bold;

  color: white;

  background:
    linear-gradient(
      135deg,
      #6254bd,
      #8979d8
    );

  border: none;

  border-radius: 12px;

  cursor: pointer;

  box-shadow:
    0 5px 14px rgba(91,75,183,0.20);

}

.back-button {

  margin-top: 12px;

  padding: 10px 20px;

  font-size: 15px;

  background: white;

  border: 1px solid #bbb;

  border-radius: 9px;

}


/* =====================================================
   入力
===================================================== */

label {

  display: block;

  margin-top: 18px;

  margin-bottom: 7px;

  font-weight: bold;

  color: #444;

}

input[type="text"],
input[type="number"] {

  width: 100%;

  padding: 12px;

  font-size: 18px;

  border:
    1px solid #d7d4e5;

  border-radius: 10px;

  background: #fcfcff;

}

.time-input {

  text-align: center;

  letter-spacing: 2px;

}

.note {

  font-size: 13px;

  color: #666;

  margin-top: 5px;

}

.choices {

  display: flex;

  gap: 10px;

}

.choice {

  flex: 1;

  position: relative;

}

.choice input {

  display: none;

}

.choice span {

  display: block;

  text-align: center;

  padding: 12px;

  border:
    2px solid #ddd;

  border-radius: 10px;

  background: #fff;

  cursor: pointer;

  font-size: 17px;

  transition: .15s;

}

.choice input:checked + span {

  background:
    linear-gradient(
      135deg,
      #6658bd,
      #897bd7
    );

  color: white;

  border-color: #6658bd;

  box-shadow:
    0 4px 10px rgba(91,75,183,0.18);

}

textarea {

  width: 100%;

  min-height: 90px;

  padding: 12px;

  font-size: 16px;

  border:
    1px solid #d7d4e5;

  border-radius: 10px;

  resize: vertical;

  background: #fcfcff;

}

button.save {

  width: 100%;

  margin-top: 25px;

  padding: 15px;

  font-size: 18px;

  font-weight: bold;

  color: white;

  background:
    linear-gradient(
      135deg,
      #6254bd,
      #8979d8
    );

  border: none;

  border-radius: 12px;

  cursor: pointer;

  box-shadow:
    0 5px 14px rgba(91,75,183,0.20);

}


/* =====================================================
   職員画面
===================================================== */

.staff-user-list {

  display: flex;

  flex-direction: column;

  gap: 12px;

  margin-top: 20px;

}

.staff-user-card {

  border:
    1px solid #e0ddef;

  border-radius: 15px;

  padding: 14px;

  background:
    linear-gradient(
      135deg,
      #ffffff,
      #faf9ff
    );

  box-shadow:
    0 3px 10px rgba(91,75,183,0.05);

}

.staff-user-name {

  font-size: 17px;

  font-weight: bold;

  margin-bottom: 10px;

  color: #444;

}

.staff-user-actions {

  display: flex;

  gap: 8px;

}

.record-view-button {

  flex: 1;

  padding: 10px;

  font-size: 15px;

  background: white;

  border:
    1px solid #cfc8ed;

  color: #51449f;

  border-radius: 9px;

  cursor: pointer;

}

.record-view-button:active {

  background: #f1effb;

}

.staff-header {

  display: flex;

  justify-content: space-between;

  align-items: center;

  gap: 10px;

  margin-bottom: 20px;

}

.staff-header h1 {

  margin: 0;

}

.logout-button {

  padding: 8px 12px;

  background: white;

  border:
    1px solid #bbb;

  border-radius: 8px;

  cursor: pointer;

}

.record-card {

  border:
    1px solid #e0ddef;

  border-radius: 15px;

  padding: 15px;

  margin-bottom: 12px;

  background:
    linear-gradient(
      135deg,
      #ffffff,
      #faf9ff
    );

}

.record-date {

  font-size: 17px;

  font-weight: bold;

  color: #51449f;

  margin-bottom: 10px;

}

.record-row {

  margin: 6px 0;

  line-height: 1.5;

}

.record-label {

  font-weight: bold;

}

.no-record,
.loading {

  text-align: center;

  color: #666;

  padding: 30px 10px;

}

.staff-back {

  width: 100%;

  margin-top: 10px;

  padding: 12px;

  background: white;

  border:
    1px solid #bbb;

  border-radius: 9px;

  font-size: 16px;

}


/* =====================================================
   管理ボタン
===================================================== */

.management-area {

  margin-top: 25px;

  border-top:
    1px solid #ddd;

  padding-top: 20px;

}

.management-button {

  width: 100%;

  padding: 13px;

  margin-top: 10px;

  font-size: 16px;

  background:
    linear-gradient(
      135deg,
      #f5f2ff,
      #eef8ff
    );

  color: #51449f;

  border:
    1px solid #c9c2ec;

  border-radius: 10px;

  cursor: pointer;

}

.management-card {

  border:
    1px solid #ddd;

  border-radius: 12px;

  padding: 15px;

  margin-top: 10px;

  background: #fafafa;

}

.management-name {

  font-size: 17px;

  font-weight: bold;

  margin-bottom: 12px;

}

.management-actions {

  display: flex;

  gap: 8px;

}

.stop-button {

  flex: 1;

  padding: 10px;

  background: white;

  border:
    1px solid #d88;

  color: #a33;

  border-radius: 8px;

  cursor: pointer;

}

.resume-button {

  flex: 1;

  padding: 10px;

  background: white;

  border:
    1px solid #8a8;

  color: #373;

  border-radius: 8px;

  cursor: pointer;

}


/* =====================================================
   利用者追加
===================================================== */

.form-input {

  width: 100%;

  padding: 13px;

  font-size: 17px;

  border:
    1px solid #d7d4e5;

  border-radius: 10px;

  margin-bottom: 5px;

  background: #fcfcff;

}

.form-note {

  font-size: 13px;

  color: #666;

  margin-bottom: 15px;

}

.add-button {

  width: 100%;

  padding: 14px;

  margin-top: 15px;

  font-size: 17px;

  font-weight: bold;

  color: white;

  background:
    linear-gradient(
      135deg,
      #6254bd,
      #8979d8
    );

  border: none;

  border-radius: 10px;

  cursor: pointer;

}


/* =====================================================
   スマホ
===================================================== */

@media (max-width: 480px) {

  body {

    padding: 10px;

  }

  .container {

    padding: 18px;

    margin: 10px auto;

    border-radius: 20px;

  }

  .record-card {

    font-size: 15px;

  }

  .staff-user-actions {

    flex-direction: column;

  }

}


/* =====================================================
   小さな装飾
===================================================== */

.container::before {

  content: "♡";

  display: block;

  text-align: center;

  font-size: 26px;

  color: #9b8ee2;

  margin-bottom: -3px;

  opacity: .75;

}

</style>
</head>


<body>

<div class="container">


<!-- =========================
     トップページ
========================= -->

<div id="loginScreen">

  <h1>自己管理シート</h1>

  <h2 style="text-align:center;">
    自分の名前を選んでください
  </h2>

  <div
    class="user-list"
    id="userList"
  ></div>

  <div
    id="userLoading"
    class="loading"
  >
    利用者一覧を読み込んでいます……
  </div>

  <button
    class="staff-button"
    id="staffButton"
  >
    職員はこちら
  </button>

</div>


<!-- =========================
     利用者パスワード
========================= -->

<div id="passwordScreen">

  <h1>自己管理シート</h1>

  <h2 id="selectedUser"></h2>

  <p>パスワードを入力してください</p>

  <input
    type="password"
    id="password"
    class="password-input"
    inputmode="numeric"
    maxlength="8"
    placeholder="パスワード"
  >

  <button
    class="login-button"
    id="loginButton"
  >
    ログイン
  </button>

  <br>

  <button
    class="back-button"
    id="backButton"
  >
    名前を選び直す
  </button>

</div>


<!-- =========================
     今日の自己管理
========================= -->

<div id="sheetScreen">

  <h1>自己管理シート</h1>

  <div
    class="date"
    id="date"
  ></div>

  <div
    style="text-align:center;font-weight:bold;"
    id="userName"
  ></div>


  <label>来所時間</label>

  <input
    type="text"
    id="arrival"
    class="time-input"
    inputmode="numeric"
    maxlength="5"
    placeholder="例：15:30"
    autocomplete="off"
  >


  <label>帰所時間</label>

  <input
    type="text"
    id="leave"
    class="time-input"
    inputmode="numeric"
    maxlength="5"
    placeholder="例：18:00"
    autocomplete="off"
  >


  <label>体温</label>

  <input
    type="text"
    id="temp"
    inputmode="decimal"
    placeholder="例：36.5"
    autocomplete="off"
  >

  <div class="note">
    体温は36.5のように「.」を入れて入力してください。
  </div>


  <label>咳</label>
  <div
    class="choices"
    id="cough"
  ></div>


  <label>頭痛</label>
  <div
    class="choices"
    id="headache"
  ></div>


  <label>鼻水</label>
  <div
    class="choices"
    id="runny"
  ></div>


  <label>のど痛</label>
  <div
    class="choices"
    id="throat"
  ></div>


  <label>その他</label>

  <textarea
    id="other"
    placeholder="気になることがあれば入力してください"
  ></textarea>


  <button
    class="save"
    id="save"
  >
    保存
  </button>

</div>


<!-- =========================
     職員ログイン
========================= -->

<div id="staffLoginScreen">

  <h1>職員用</h1>

  <p>職員用パスワードを入力してください</p>

  <input
    type="password"
    id="staffPassword"
    class="staff-input"
    placeholder="パスワード"
    autocomplete="current-password"
  >

  <button
    class="login-button"
    id="staffLoginButton"
  >
    職員ログイン
  </button>

  <button
    class="back-button"
    id="staffLoginBackButton"
  >
    戻る
  </button>

</div>


<!-- =========================
     職員 利用者選択
========================= -->

<div id="staffScreen">

  <div class="staff-header">

    <h1>記録確認</h1>

    <button
      class="logout-button"
      id="staffLogoutButton"
    >
      ログアウト
    </button>

  </div>

  <p style="text-align:center;">
    確認する利用者を選んでください
  </p>

  <div
    class="staff-user-list"
    id="staffUserList"
  ></div>


  <div class="management-area">

    <button
      class="management-button"
      id="addUserButton"
    >
      ＋ 利用者を追加
    </button>

    <button
      class="management-button"
      id="inactiveUserButton"
    >
      利用停止者を確認
    </button>

  </div>

</div>


<!-- =========================
     利用者追加
========================= -->

<div id="addUserScreen">

  <div class="staff-header">

    <h1>利用者追加</h1>

  </div>

  <label>利用者名</label>

  <input
    type="text"
    id="newUserName"
    class="form-input"
    placeholder="例：山田 太郎"
  >

  <label>ふりがな</label>

  <input
    type="text"
    id="newUserFurigana"
    class="form-input"
    placeholder="例：やまだ たろう"
  >

  <div class="form-note">
    苗字と名前の間にスペースを入れてください。
  </div>

  <label>ログインパスワード</label>

  <input
    type="text"
    id="newUserPassword"
    class="form-input"
    inputmode="numeric"
    maxlength="8"
    placeholder="4桁の数字"
  >

  <div class="form-note">
    利用者本人が入力するパスワードを設定してください。
  </div>

  <button
    class="add-button"
    id="saveNewUserButton"
  >
    利用者を登録
  </button>

  <button
    class="staff-back"
    id="addUserBackButton"
  >
    職員画面に戻る
  </button>

</div>


<!-- =========================
     利用停止者一覧
========================= -->

<div id="inactiveUserScreen">

  <div class="staff-header">

    <h1>利用停止者</h1>

  </div>

  <div id="inactiveUserList"></div>

  <button
    class="staff-back"
    id="inactiveBackButton"
  >
    職員画面に戻る
  </button>

</div>


<!-- =========================
     職員 記録一覧
========================= -->

<div id="recordScreen">

  <div class="staff-header">

    <h1>記録一覧</h1>

    <button
      class="logout-button"
      id="recordLogoutButton"
    >
      ログアウト
    </button>

  </div>

  <div
    style="
      text-align:center;
      font-size:18px;
      font-weight:bold;
      color:#51449f;
      margin-bottom:20px;
    "
    id="recordUserName"
  ></div>

  <div id="records"></div>

  <button
    class="staff-back"
    id="recordBackButton"
  >
    利用者選択に戻る
  </button>

</div>

</div>


<!-- =========================
     Supabase
========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


/* =====================================================
   Supabase設定
===================================================== */

const SUPABASE_URL =
  "https://yiohaakomljvrulaajoy.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_dcqfIAZQTHkG3NbAgvkftw_emYjMZ_F";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =====================================================
   職員メールアドレス
===================================================== */

const STAFF_EMAIL =
  "legend.of.broly241@gmail.com";


/* =====================================================
   選択中の利用者
===================================================== */

let selectedUser = null;


/* =====================================================
   画面切り替え
===================================================== */

function hideAllScreens() {

  document.getElementById("loginScreen").style.display = "none";

  document.getElementById("passwordScreen").style.display = "none";

  document.getElementById("sheetScreen").style.display = "none";

  document.getElementById("staffLoginScreen").style.display = "none";

  document.getElementById("staffScreen").style.display = "none";

  document.getElementById("recordScreen").style.display = "none";

  document.getElementById("addUserScreen").style.display = "none";

  document.getElementById("inactiveUserScreen").style.display = "none";

}


/* =====================================================
   ふりがな順
===================================================== */

function sortUsersByFurigana(users) {

  return users.sort((a,b) => {

    const aFurigana =
      String(a.furigana || "").trim();

    const bFurigana =
      String(b.furigana || "").trim();

    return aFurigana.localeCompare(
      bFurigana,
      "ja"
    );

  });

}


/* =====================================================
   利用者一覧
===================================================== */

async function loadUsers() {

  const userList =
    document.getElementById("userList");

  const loading =
    document.getElementById("userLoading");

  userList.innerHTML = "";

  loading.style.display = "block";


  const { data, error } =
    await supabaseClient
      .from("users")
      .select(
        "id,name,furigana,password,is_active"
      )
      .eq("is_active", true);


  loading.style.display = "none";


  if (error) {

    console.error(error);

    userList.innerHTML = `
      <div class="no-record">
        利用者一覧を読み込めませんでした。<br><br>
        ${error.message}
      </div>
    `;

    return;

  }


  if (!data || data.length === 0) {

    userList.innerHTML = `
      <div class="no-record">
        利用者が登録されていません。
      </div>
    `;

    return;

  }


  sortUsersByFurigana(data);


  data.forEach(user => {

    const button =
      document.createElement("button");

    button.className =
      "user-button";

    button.textContent =
      user.name;


    button.addEventListener(
      "click",
      () => {

        selectedUser = user;

        hideAllScreens();

        document
          .getElementById("passwordScreen")
          .style.display = "block";

        document
          .getElementById("selectedUser")
          .textContent =
            user.name;

        document
          .getElementById("password")
          .value = "";

        document
          .getElementById("password")
          .focus();

      }
    );


    userList.appendChild(button);

  });

}


/* =====================================================
   初期表示
===================================================== */

hideAllScreens();

document
  .getElementById("loginScreen")
  .style.display = "block";

loadUsers();


/* =====================================================
   利用者ログイン
===================================================== */

document
  .getElementById("loginButton")
  .addEventListener(
    "click",
    () => {

        function(e) {

          if (
            this.dataset.checked ===
            "true"
          ) {

            this.checked = false;

            this.dataset.checked =
              "false";

            e.preventDefault();

          } else {

            const name =
              this.name;

            document
              .querySelectorAll(
                `input[name="${name}"]`
              )
              .forEach(
                other => {

                  other.dataset.checked =
                    "false";

                }
              );

            this.dataset.checked =
              "true";

          }

        }
      );

/* =====================================================
   時間入力
===================================================== */

function setupTimeInput(id) {

  const input =
    document.getElementById(id);


  input.addEventListener(
    "input",
    function() {

      let value =
        this.value;

      value =
        value.replace(
          /[^0-9]/g,
          ""
        );

      value =
        value.slice(0,4);


      if (value.length > 2) {

        value =
          value.slice(0,2)
          + ":"
          + value.slice(2);

      }


      this.value =
        value;


      if (value.length === 3) {

        this.setSelectionRange(
          3,
          3
        );

      }

    }
  );


  input.addEventListener(
    "blur",
    function() {

      let value =
        this.value.replace(
          /[^0-9]/g,
          ""
        );


      if (value.length === 3) {

        value =
          "0" + value;

      }


      if (value.length === 4) {

        this.value =
          value.slice(0,2)
          + ":"
          + value.slice(2);

      }

    }
  );

}

/* =====================================================
   保存
===================================================== */

document
  .getElementById("save")
  .addEventListener(
    "click",
    async function() {

      const arrival =
        document
          .getElementById("arrival")
          .value;

      const leave =
        document
          .getElementById("leave")
          .value;

      const temp =
        document
          .getElementById("temp")
          .value;


      if (
        !arrival ||
        !leave ||
        !temp
      ) {

        alert(
          "来所時間・帰所時間・体温を入力してください。"
        );

        return;

      }


      const timePattern =
        /^(?:[01]\d|2[0-3]):[0-5]\d$/;


      if (
        !timePattern.test(arrival) ||
        !timePattern.test(leave)
      ) {

        alert(
          "時間は「15:30」のように入力してください。"
        );

        return;

      }


      if (
        !/^\d{2}\.\d$/.test(temp)
      ) {

        alert(
          "体温は「36.5」のように「.」を入れて入力してください。"
        );

        return;

      }


      const healthNames = [

        "cough",

        "headache",

        "runny",

        "throat"

      ];


      const healthValues = {};


      for (
        const name of healthNames
      ) {

        const selected =
          document.querySelector(
            `input[name="${name}"]:checked`
          );


        if (!selected) {

          alert(
            "体調変化の「有・無」をすべて選択してください。"
          );

          return;

        }


        healthValues[name] =
          selected.value;

      }


      const recordDate =
        `${year}-${String(month).padStart(2,"0")}-${String(day).padStart(2,"0")}`;


      const other =
        document
          .getElementById("other")
          .value;


      const { error } =
        await supabaseClient
          .from("health_records")
          .insert([

            {

              user_name:
                selectedUser.name,

              record_date:
                recordDate,

              arrival:
                arrival,

              leave:
                leave,

              temperature:
                Number(temp),

              cough:
                healthValues.cough,

              headache:
                healthValues.headache,

              runny:
                healthValues.runny,

              throat:
                healthValues.throat,

              other:
                other

            }

          ]);


      if (error) {

        console.error(error);

        alert(
          "保存できませんでした。\n"
          + error.message
        );

        return;

      }


      alert(
        "記録を保存しました。"
      );

    }
  );

async function stopUser(id, name) {

  const answer =
    confirm(
      `${name}さんを利用停止にしますか？\n\n`
      +
      "利用停止しても、これまでの記録は削除されません。"
    );


  if (!answer) {

    return;

  }


  const { error } =
    await supabaseClient
      .from("users")
      .update({
        is_active: false
      })
      .eq("id", id);


  if (error) {

    console.error(error);

    alert(
      "利用停止にできませんでした。\n"
      + error.message
    );

    return;

  }


  alert(
    `${name}さんを利用停止にしました。`
  );


  loadStaffUsers();

}

  const { error } =

        is_active: true

  if (error) {

    console.error(error);

    alert(
      "利用を再開できませんでした。\n"
      + error.message
    );

    return;

  }


  alert(
    `${name}さんの利用を再開しました。`
  );


  loadInactiveUsers();

}


/* =====================================================
   記録取得
===================================================== */

async function loadRecords(userName) {

  hideAllScreens();

  document
    .getElementById("recordScreen")
    .style.display = "block";


  document
    .getElementById("recordUserName")
    .textContent =
      `${userName}の記録`;


  const records =
    document
      .getElementById("records");


  records.innerHTML =
    `<div class="loading">
      記録を読み込んでいます……
    </div>`;


  const { data, error } =
    await supabaseClient
      .from("health_records")
      .select("*")
      .eq("user_name", userName)
      .order(
        "record_date",
        {
          ascending: false
        }
      );


  if (error) {

    console.error(error);

    records.innerHTML =
      `<div class="no-record">
        記録を読み込めませんでした。<br><br>
        ${error.message}
      </div>`;

    return;

  }


  if (
    !data ||
    data.length === 0
  ) {

    records.innerHTML =
      `<div class="no-record">
        この利用者の記録はありません。
      </div>`;

    return;

  }


  records.innerHTML = "";


  data.forEach(record => {

    const card =
      document.createElement("div");

    card.className =
      "record-card";


    const dateParts =
      record.record_date
        ? record.record_date.split("-")
        : [];


    let displayDate =
      record.record_date || "";


    if (
      dateParts.length === 3
    ) {

      displayDate =
        `${Number(dateParts[0])}年`
        +
        `${Number(dateParts[1])}月`
        +
        `${Number(dateParts[2])}日`;

    }


    card.innerHTML = `

      <div class="record-date">
        ${displayDate}
      </div>


      <div class="record-row">
        <span class="record-label">
          来所：
        </span>
        ${record.arrival || ""}
      </div>


      <div class="record-row">
        <span class="record-label">
          帰所：
        </span>
        ${record.leave || ""}
      </div>


      <div class="record-row">
        <span class="record-label">
          体温：
        </span>
        ${record.temperature ?? ""}
      </div>


      <div class="record-row">
        <span class="record-label">
          咳：
        </span>
        ${record.cough || ""}
      </div>


      <div class="record-row">
        <span class="record-label">
          頭痛：
        </span>
        ${record.headache || ""}
      </div>


      <div class="record-row">
        <span class="record-label">
          鼻水：
        </span>
        ${record.runny || ""}
      </div>


      <div class="record-row">
        <span class="record-label">
          のど痛：
        </span>
        ${record.throat || ""}
      </div>


      <div class="record-row">
        <span class="record-label">
          その他：
        </span>
        ${record.other || "なし"}
      </div>

    `;


    records.appendChild(card);

  });

}
